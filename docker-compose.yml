# 本地容器化运行：数据库/Redis 使用外部测试实例（与 k8s test 环境共用）。
# 凭据统一放在 apps/web/.env.local（gitignored），经 env_file 注入，勿写死在此文件。
services:
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3100}
    restart: unless-stopped
    ports:
      - "3100:3000"
    env_file:
      - ./apps/web/.env.local
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3100}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
