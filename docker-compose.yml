# 本地容器化运行：数据库/Redis 使用外部测试实例（与 k8s test 环境共用）。
# 凭据统一放在 apps/web/.env.local（gitignored），经 env_file 注入，勿写死在此文件。
services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:${WEB_PORT:-3000}}
        # 取帧性能埋点（构建期内联）：本地排查时 WEB_BUILD_DEBUG_FRAMES=1 docker compose build
        - NEXT_PUBLIC_DEBUG_FRAMES=${WEB_BUILD_DEBUG_FRAMES:-}
    restart: unless-stopped
    ports:
      # 宿主端口默认 3000；本机 3000 被 dev server 占用时，在根目录 .env
      # （gitignored）里设 WEB_PORT=3100 覆盖，无需改动本文件。
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - ./apps/web/.env.local
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:${WEB_PORT:-3000}}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 局域网 https 反代：编辑器的 WebCodecs/OPFS 需要安全上下文，
  # 纯 http + 局域网 IP 是"不安全"的，浏览器不给这些 API（表现为
  # 素材无缩略图、播放黑屏、取帧失败）。此容器在 3443 上终结 TLS
  # （Caddy 内置 CA 自签，设备首次访问信任一次警告）后转发给 web。
  # 证书/CA 持久化在 caddy_data 卷；站点地址见 docker/caddy/Caddyfile。
  caddy:
    # 1panel 不代理官方 library/ 命名空间，caddy 走 daocloud 镜像源
    image: docker.m.daocloud.io/library/caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "3443:3443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
