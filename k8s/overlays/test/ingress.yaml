apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mycut-web
  labels:
    app.kubernetes.io/name: mycut-web
  # 若测试环境不需要公网 TLS，可保持注释；开启时配合 cert-manager
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: nginx
  rules:
    - host: test.mycut.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mycut-web
                port:
                  number: 80
