# 测试环境：单副本、低资源、测试域名。
# 数据库/Redis 由外部独立部署，凭据在 mycut-secrets（见 secret.example.yaml）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mycut-test

resources:
  - ../../base
  - ingress.yaml

images:
  # 部署脚本每次发布把 newTag 覆盖为不可变 tag（日期.git sha），
  # 这里的 test-latest 仅是手工 kustomize build 的兜底值
  - name: registry.example.com/mycut/web
    newName: gitlab.sunwin-sh.com/development/mycut/web
    newTag: test-latest

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: mycut-web

configMapGenerator:
  - name: mycut-config
    options:
      disableNameSuffixHash: true
    literals:
      # 必须与 ingress host、DNS、cert-manager 签发域名三者一致；
      # 该域名必须以 https 访问（编辑器的 WebCodecs/OPFS 依赖安全上下文）
      - NEXT_PUBLIC_SITE_URL=https://test.mycut.sunwin-sh.com
      - NEXT_PUBLIC_MARBLE_API_URL=https://api.marblecms.com
