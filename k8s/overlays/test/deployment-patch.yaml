apiVersion: apps/v1
kind: Deployment
metadata:
  name: mycut-web
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: web
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          env:
            - name: NEXT_PUBLIC_SITE_URL
              valueFrom:
                configMapKeyRef:
                  name: mycut-config
                  key: NEXT_PUBLIC_SITE_URL
            - name: APP_ENV
              value: test
            - name: LOG_LEVEL
              value: INFO
