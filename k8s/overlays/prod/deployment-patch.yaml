apiVersion: apps/v1
kind: Deployment
metadata:
  name: mycut-web
spec:
  replicas: 2
  template:
    spec:
      # 与 base 保持一致（Trivy 逐文件扫描；strategic merge 按 key 合并，不产生重复）
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # 与 base 相同的只读根文件系统配套挂载（按 mountPath 合并）
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: NEXT_PUBLIC_SITE_URL
              valueFrom:
                configMapKeyRef:
                  name: mycut-config
                  key: NEXT_PUBLIC_SITE_URL
            - name: APP_ENV
              value: prod
            - name: LOG_LEVEL
              value: INFO
      topologySpreadConstraints:
        # 双副本尽量落在不同节点
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mycut-web
