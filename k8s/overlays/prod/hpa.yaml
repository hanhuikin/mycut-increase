apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mycut-web
  labels:
    app.kubernetes.io/name: mycut-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mycut-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
