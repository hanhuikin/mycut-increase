# 数据库迁移 Job：每次发布前执行一次。
# 用途：drizzle-kit migrate 应用 apps/web/migrations 下的增量迁移。
# 依赖：镜像内需包含 drizzle.config.ts 与 migrations/（见 Dockerfile 可选层），
#       或者改用独立迁移镜像。DATABASE_URL 指向目标环境数据库。
apiVersion: batch/v1
kind: Job
metadata:
  name: mycut-migrate
  labels:
    app.kubernetes.io/name: mycut-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mycut-migrate
    spec:
      restartPolicy: Never
      # 迁移不需要访问 K8s API，不挂载 ServiceAccount token
      automountServiceAccountToken: false
      # Pod 级安全上下文：与 Deployment 一致，镜像内非 root 用户 nextjs（uid/gid 1001）
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.example.com/mycut/web:IMAGE_TAG
          command: ["bun", "run", "db:migrate"]
          workingDir: /app/apps/web
          envFrom:
            - secretRef:
                name: mycut-secrets
          # 迁移是短任务，资源按保守值给；ephemeral-storage 覆盖 drizzle 临时产物
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
          # 只读根文件系统下保留 /tmp 可写
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
