apiVersion: apps/v1
kind: Deployment
metadata:
  name: mycut-web
  labels:
    app.kubernetes.io/name: mycut-web
spec:
  # 环境覆盖（test=1 / prod=2）。任务惰性同步已加 advisory lock，多副本安全。
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mycut-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mycut-web
    spec:
      # 私有镜像仓库凭证；由部署脚本按 namespace 创建（见 script/deploy-test.sh）
      imagePullSecrets:
        - name: mycut-registry
      # Pod 级安全上下文：镜像内非 root 用户 nextjs（uid/gid 1001）
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.example.com/mycut/web:IMAGE_TAG
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: mycut-secrets
          env:
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # 只读根文件系统下 Next 仍需可写目录（见下方 volumes）
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
          startupProbe:
            # Next 冷启动 + standalone 产物加载
            httpGet:
              path: /api/health
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            # DB 不通即摘除流量（/api/health/deep 返回 503）
            httpGet:
              path: /api/health/deep
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      # 只读根文件系统需要的可写目录：/tmp（Node 临时文件）与
      # /app/apps/web/.next/cache（Next 图片优化/构建缓存，standalone 产物在同级）
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
