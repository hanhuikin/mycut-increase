# 模板：复制为 k8s/secrets/<env>.yaml 后填入真实值（k8s/secrets/ 整个目录已 gitignore，切勿提交）。
# 每环境一份：test.yaml（namespace: mycut-test）/ prod.yaml（namespace: mycut-prod）。
# metadata.namespace 必须写目标命名空间；base 部署只按名字引用 mycut-secrets，不含任何真实值。
# 应用命令：kubectl apply -f k8s/secrets/test.yaml
apiVersion: v1
kind: Secret
metadata:
  name: mycut-secrets
  namespace: mycut-test
type: Opaque
stringData:
  # postgresql://<user>:<password>@<host>:5432/<db>
  DATABASE_URL: "postgresql://mycut:CHANGE_ME@test-db.internal:5432/mycut"
  # redis://:<password>@<host>:6379
  REDIS_URL: "redis://:CHANGE_ME@test-redis.internal:6379"
  # >=32 字符随机串；轮换会使全部登录会话失效
  BETTER_AUTH_SECRET: "CHANGE_ME_openssl_rand_base64_32"
  # 64 位 hex（32 字节）；加密数据库中的 AI 渠道密钥，多环境各持一份且不可丢失
  MODEL_CREDENTIALS_KEY: "CHANGE_ME_64_hex_chars"
  # 可选：火山方舟渠道
  # 官方模板遗留集成，占位即可
